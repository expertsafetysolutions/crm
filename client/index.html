<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#E11D48" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ExpertSafety" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <title>Expert Safety Solutions | Field Service & CRM PWA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-rose-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // The service worker is a PRODUCTION-only concern. Against Vite's dev server it caches
      // module URLs that change on every dependency re-optimise, which then 504 as "Outdated
      // Optimize Dep" and leave a blank page. On localhost any already-installed worker is
      // unregistered and its caches dropped, so a dev machine self-heals on next load.
      (function () {
        if (!('serviceWorker' in navigator)) return;
        var isLocal = ['localhost', '127.0.0.1', '::1'].indexOf(location.hostname) !== -1;

        if (isLocal) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
          if (window.caches && caches.keys) {
            caches.keys().then(function (names) {
              names.forEach(function (n) { caches.delete(n); });
            });
          }
          return;
        }

        // Offers a reload when a new build is live, rather than reloading on its own. Staff fill
        // job cards and quotations in long-lived forms whose drafts live only in component state,
        // so a surprise reload would silently destroy work in progress. The choice stays theirs.
        function announceUpdate() {
          if (document.getElementById('sw-update-bar')) return;
          var bar = document.createElement('div');
          bar.id = 'sw-update-bar';
          bar.setAttribute('role', 'status');
          bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:2147483647;'
            + 'display:flex;align-items:center;gap:10px;padding:10px 14px;'
            + 'padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px));'
            + 'background:#0f172a;color:#fff;font:600 13px system-ui,-apple-system,sans-serif;'
            + 'box-shadow:0 -2px 12px rgba(0,0,0,.25)';
          var msg = document.createElement('span');
          msg.style.cssText = 'flex:1;min-width:0';
          msg.textContent = 'A new version is available.';
          var reload = document.createElement('button');
          reload.type = 'button';
          reload.textContent = 'Reload';
          reload.style.cssText = 'min-height:40px;padding:0 16px;border:0;border-radius:10px;'
            + 'background:#10b981;color:#fff;font:800 13px system-ui;cursor:pointer';
          reload.onclick = function () { location.reload(); };
          var later = document.createElement('button');
          later.type = 'button';
          later.textContent = 'Later';
          later.style.cssText = 'min-height:40px;padding:0 12px;border:0;border-radius:10px;'
            + 'background:transparent;color:#94a3b8;font:700 12px system-ui;cursor:pointer';
          later.onclick = function () { bar.remove(); };
          bar.appendChild(msg); bar.appendChild(later); bar.appendChild(reload);
          document.body.appendChild(bar);
        }

        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').then(function (reg) {
            // A worker already waiting means this tab opened while an update was pending.
            if (reg.waiting && navigator.serviceWorker.controller) announceUpdate();

            reg.addEventListener('updatefound', function () {
              var incoming = reg.installing;
              if (!incoming) return;
              incoming.addEventListener('statechange', function () {
                // An existing controller means this is an update, not the first install.
                if (incoming.state === 'installed' && navigator.serviceWorker.controller) {
                  announceUpdate();
                }
              });
            });

            // An installed PWA can stay open for days without ever re-requesting the worker, so
            // deploys would go unnoticed. Re-checking when the app is brought to the foreground
            // costs one conditional request and is what makes a same-day release actually arrive.
            document.addEventListener('visibilitychange', function () {
              if (document.visibilityState === 'visible') reg.update().catch(function () {});
            });
          }).catch(function () { /* the app works without a worker */ });
        });
      })();
    </script>
  </body>
</html>
